<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Waste - AnnaSetu AI</title>
    <link rel="stylesheet" href="/shared/styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <script type="module" src="/shared/nav.js"></script>

    <main id="main-content" class="page">
        <div class="container">
            <header class="page-header">
                <h1 class="page-title">
                    <span>📝</span>
                    <span>Log Daily Waste</span>
                    <span class="goal-tag">Monitor</span>
                </h1>
                <p class="page-subtitle">Record prepared, served, and leftover plates for your kitchen</p>
            </header>

            <div class="card" style="margin-bottom: var(--space-6);">
                <div class="card-header">
                    <h2 class="card-title">New Waste Log</h2>
                </div>
                <div class="card-body">
                    <form id="waste-form" class="form-grid">
                        <div class="form-group">
                            <label for="log-date" class="form-label">Date</label>
                            <input type="date" id="log-date" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="log-slot" class="form-label">Slot</label>
                            <select id="log-slot" class="form-select" required>
                                <option value="breakfast">breakfast</option>
                                <option value="lunch" selected>lunch</option>
                                <option value="dinner">dinner</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="log-prepared" class="form-label">Prepared</label>
                            <input type="number" id="log-prepared" class="form-input" min="0" step="1" value="180" required>
                        </div>
                        <div class="form-group">
                            <label for="log-served" class="form-label">Served</label>
                            <input type="number" id="log-served" class="form-input" min="0" step="1" value="165" required>
                        </div>
                        <div class="form-group">
                            <label for="log-leftover" class="form-label">Leftover</label>
                            <input type="number" id="log-leftover" class="form-input" min="0" step="1" value="15" required>
                        </div>
                        <div class="form-group" style="display:flex; align-items:center; gap:0.5rem; padding-top:1.5rem;">
                            <input type="checkbox" id="log-ran-short">
                            <label for="log-ran-short" class="form-label" style="margin:0;">Food ran out</label>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <button type="submit" class="btn btn-primary" id="btn-log-waste">Save Waste Log</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Recent Logs</h2>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Slot</th>
                                    <th>Prepared</th>
                                    <th>Served</th>
                                    <th>Leftover</th>
                                    <th>Food ran out</th>
                                </tr>
                            </thead>
                            <tbody id="logs-body">
                                <tr><td colspan="6" class="text-muted text-center">Loading logs...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { logWaste, getWasteLogs, withSubmitLock, showError, showToast, escapeHtml } from '/shared/api.js';
        import { navReady } from '/shared/nav.js';
        import { state, getDemoTime } from '/shared/state.js';

        async function loadLogs() {
            const tbody = document.getElementById('logs-body');
            if (!state.user) return;
            tbody.innerHTML = '<tr><td colspan="6" class="text-muted text-center">Loading logs...</td></tr>';
            try {
                const res = await getWasteLogs(state.user.id, 50);
                const logs = res.logs || [];
                if (!logs.length) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-muted text-center">No waste logs recorded yet.</td></tr>';
                    return;
                }
                tbody.innerHTML = logs.map(l => `
                    <tr>
                        <td>${escapeHtml(l.date)}</td>
                        <td>${escapeHtml(l.slot)}</td>
                        <td>${escapeHtml(l.prepared)}</td>
                        <td>${escapeHtml(l.served)}</td>
                        <td>${escapeHtml(l.leftover)}</td>
                        <td>${l.ran_short ? '<span class="badge badge-danger">Yes</span>' : 'No'}</td>
                    </tr>
                `).join('');
            } catch {
                tbody.innerHTML = '<tr><td colspan="6" class="text-danger text-center">Failed to load logs.</td></tr>';
            }
        }

        document.getElementById('waste-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!state.user) return;
            const prepared = Number(document.getElementById('log-prepared').value);
            const served = Number(document.getElementById('log-served').value);
            const leftover = Number(document.getElementById('log-leftover').value);

            if ([prepared, served, leftover].some(n => Number.isNaN(n) || n < 0)) {
                showError('Prepared, served, and leftover must be numbers >= 0.');
                return;
            }
            if (served + leftover !== prepared) {
                showError('Served + leftover must equal prepared.');
                return;
            }

            await withSubmitLock(e.currentTarget, async () => {
                await logWaste({
                    kitchen_id: String(state.user.id),
                    date: document.getElementById('log-date').value,
                    slot: document.getElementById('log-slot').value,
                    prepared,
                    served,
                    leftover,
                    ran_short: document.getElementById('log-ran-short').checked,
                });
                showToast('Waste log saved!', 'success');
                await loadLogs();
            });
        });

        await navReady;
        document.getElementById('log-date').value = getDemoTime().toISOString().slice(0, 10);
        await loadLogs();
    </script>
</body>
</html>
