<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Waste - AnnaSetu AI</title>
    <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <script type="module" src="shared/nav.js"></script>

    <main id="main-content" class="page">
        <div class="container">
            <header class="page-header">
                <h1 class="page-title">
                    <span>📋</span>
                    <span>Log Waste Entry</span>
                </h1>
                <p class="page-subtitle">Record food waste with safety evaluation</p>
            </header>

            <!-- Waste Log Form -->
            <div class="card" style="margin-bottom: var(--space-6);">
                <div class="card-header">
                    <h2 class="card-title">New Waste Entry</h2>
                </div>
                <div class="card-body">
                    <form id="waste-form" class="form-grid">
                        <div class="form-group">
                            <label for="item-name" class="form-label">Item Name <span class="required">*</span></label>
                            <input type="text" id="item-name" class="form-input" placeholder="e.g., Cooked Rice, Dal, Vegetables" required>
                        </div>
                        <div class="form-group">
                            <label for="category" class="form-label">Category <span class="required">*</span></label>
                            <select id="category" class="form-select" required>
                                <option value="">Select Category</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="quantity" class="form-label">Quantity (kg) <span class="required">*</span></label>
                            <input type="number" id="quantity" class="form-input" step="0.1" min="0.1" placeholder="0.0" required>
                        </div>
                        <div class="form-group">
                            <label for="reason" class="form-label">Reason <span class="required">*</span></label>
                            <select id="reason" class="form-select" required>
                                <option value="">Select Reason</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea id="notes" class="form-input" rows="2" placeholder="Additional details..."></textarea>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <button type="submit" class="btn btn-primary" id="btn-submit-waste">
                                <span>💾</span> Log Waste Entry
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Safety Evaluation Result -->
            <div class="card" style="margin-bottom: var(--space-6); display: none;" id="safety-result-card">
                <div class="card-header">
                    <h2 class="card-title">Safety Evaluation Result</h2>
                </div>
                <div class="card-body" id="safety-result-content"></div>
            </div>

            <!-- Waste History -->
            <div class="card">
                <div class="card-header">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-3);">
                        <h2 class="card-title">Waste History</h2>
                        <div style="display: flex; gap: var(--space-2);">
                            <button class="btn btn-sm btn-outline" id="btn-refresh-history">
                                <span>🔄</span> Refresh
                            </button>
                            <button class="btn btn-sm btn-secondary" id="btn-export-csv">
                                <span>📥</span> Export CSV
                            </button>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Date/Time</th>
                                    <th>Item</th>
                                    <th>Category</th>
                                    <th>Qty (kg)</th>
                                    <th>Reason</th>
                                    <th>Safety</th>
                                    <th>Disposal</th>
                                    <th>Notes</th>
                                </tr>
                            </thead>
                            <tbody id="waste-history-body">
                                <tr>
                                    <td colspan="8" class="text-center text-muted">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { state, initState } from './shared/state.js';
        import { api, formatDateTime, showToast, escapeHtml } from './shared/api.js';
        import { updateNavUI } from './shared/nav.js';

        initState();
        updateNavUI();

        if (!state.canAccessPage(['kitchen', 'processing_unit'])) {
            window.location.href = 'index.html';
        }

        const form = document.getElementById('waste-form');
        const safetyResultCard = document.getElementById('safety-result-card');
        const safetyResultContent = document.getElementById('safety-result-content');
        const historyBody = document.getElementById('waste-history-body');

        let categories = [];
        let reasons = [];

        async function initPage() {
            await loadCategoriesAndReasons();
            await loadHistory();
        }

        async function loadCategoriesAndReasons() {
            try {
                const safetyCategories = await api.getSafetyCategories();
                categories = safetyCategories.categories;
                reasons = safetyCategories.reasons;

                const catSelect = document.getElementById('category');
                catSelect.innerHTML = '<option value="">Select Category</option>' +
                    categories.map(c => `<option value="${c}">${escapeHtml(c)}</option>`).join('');

                const reasonSelect = document.getElementById('reason');
                reasonSelect.innerHTML = '<option value="">Select Reason</option>' +
                    reasons.map(r => `<option value="${r}">${escapeHtml(r.replace('_', ' '))}</option>`).join('');
            } catch (e) {
                console.error('Failed to load categories:', e);
                showToast('Failed to load categories', 'error');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            await submitWasteEntry();
        });

        async function submitWasteEntry() {
            const itemName = document.getElementById('item-name').value.trim();
            const category = document.getElementById('category').value;
            const quantity = parseFloat(document.getElementById('quantity').value);
            const reason = document.getElementById('reason').value;
            const notes = document.getElementById('notes').value.trim();

            if (!itemName || !category || !quantity || !reason) {
                showToast('Please fill all required fields', 'warning');
                return;
            }

            const btn = document.getElementById('btn-submit-waste');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Logging...';

            try {
                // First evaluate safety
                const safetyEval = await api.evaluateSafety({
                    category,
                    reason,
                    hours_since_prepared: 0
                });

                // Then log the waste
                const wasteResult = await api.logWaste({
                    item_name: itemName,
                    category,
                    quantity_kg: quantity,
                    reason,
                    notes
                });

                displaySafetyResult(safetyEval, wasteResult);
                safetyResultCard.style.display = 'block';
                safetyResultCard.scrollIntoView({ behavior: 'smooth' });

                form.reset();
                await loadHistory();
            } catch (e) {
                console.error('Failed to log waste:', e);
                showToast('Failed to log waste: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>💾</span> Log Waste Entry';
            }
        }

        function displaySafetyResult(safety, waste) {
            const { safety_level, max_hours_valid, disposal_method, label_required, confidence } = safety;

            const levelClass = {
                'safe_for_human': 'success',
                'animal_feed_only': 'warning',
                'compost_only': 'warning',
                'discard': 'danger'
            }[safety_level] || 'gray';

            const levelLabels = {
                'safe_for_human': '✅ Safe for Human Consumption',
                'animal_feed_only': '🐄 Animal Feed Only',
                'compost_only': '🌱 Compost Only',
                'discard': '🚫 Discard Required'
            };

            safetyResultContent.innerHTML = `
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); margin-bottom: var(--space-4);">
                    <div class="stat-card">
                        <div class="stat-icon stat-icon-${levelClass}">${levelLabels[safety_level]?.split(' ')[0] || '❓'}</div>
                        <div class="stat-content">
                            <div class="stat-value">${escapeHtml(levelLabels[safety_level] || safety_level)}</div>
                            <div class="stat-label">Safety Level</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon stat-icon-info">⏱️</div>
                        <div class="stat-content">
                            <div class="stat-value">${max_hours_valid}h</div>
                            <div class="stat-label">Max Hours Valid</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon stat-icon-primary">🎯</div>
                        <div class="stat-content">
                            <div class="stat-value">${Math.round(confidence * 100)}%</div>
                            <div class="stat-label">Confidence</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon stat-icon-${label_required ? 'warning' : 'success'}">${label_required ? '🏷️' : '✅'}</div>
                        <div class="stat-content">
                            <div class="stat-value">${label_required ? 'Required' : 'Not Required'}</div>
                            <div class="stat-label">Safety Label</div>
                        </div>
                    </div>
                </div>

                <div class="alert alert-${levelClass}">
                    <strong>Disposal Method:</strong> ${escapeHtml(disposal_method.replace('_', ' '))}
                    ${label_required ? '<br><strong>⚠️ Safety label must be printed and attached!</strong>' : ''}
                </div>

                <div style="display: flex; gap: var(--space-3); margin-top: var(--space-4);">
                    ${safety_level === 'safe_for_human' ? `
                        <a href="post-surplus.html" class="btn btn-success">
                            <span>🏪</span> Post as Surplus
                        </a>
                    ` : ''}
                    <button class="btn btn-secondary" onclick="this.closest('.card').style.display='none'">
                        <span>✕</span> Dismiss
                    </button>
                </div>
            `;
        }

        async function loadHistory() {
            try {
                const logs = await api.getWasteLogs({ limit: 50 });
                if (!logs || logs.length === 0) {
                    historyBody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No waste entries yet</td></tr>';
                    return;
                }

                historyBody.innerHTML = logs.map(log => `
                    <tr>
                        <td>${formatDateTime(log.created_at)}</td>
                        <td>${escapeHtml(log.item_name)}</td>
                        <td>${escapeHtml(log.category)}</td>
                        <td>${log.quantity_kg}</td>
                        <td><span class="badge badge-${getReasonBadgeClass(log.reason)}">${escapeHtml(log.reason.replace('_', ' '))}</span></td>
                        <td>${log.safety_level ? `<span class="badge badge-${getSafetyBadgeClass(log.safety_level)}">${escapeHtml(log.safety_level.replace('_', ' '))}</span>` : '<span class="text-muted">--</span>'}</td>
                        <td>${log.disposal_method ? escapeHtml(log.disposal_method.replace('_', ' ')) : '<span class="text-muted">--</span>'}</td>
                        <td>${escapeHtml(log.notes || '')}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Failed to load history:', e);
                historyBody.innerHTML = '<tr><td colspan="8" class="text-center text-danger">Failed to load history</td></tr>';
            }
        }

        function getReasonBadgeClass(reason) {
            const classes = {
                'overproduction': 'warning',
                'spoilage': 'danger',
                'expired': 'danger',
                'trim_waste': 'info',
                'quality_issue': 'warning',
                'other': 'gray'
            };
            return classes[reason] || 'gray';
        }

        function getSafetyBadgeClass(level) {
            const classes = {
                'safe_for_human': 'success',
                'animal_feed_only': 'warning',
                'compost_only': 'warning',
                'discard': 'danger'
            };
            return classes[level] || 'gray';
        }

        document.getElementById('btn-refresh-history')?.addEventListener('click', loadHistory);

        document.getElementById('btn-export-csv')?.addEventListener('click', async () => {
            try {
                const csv = await api.exportSafetyRecordsCSV();
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `safety_records_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('CSV exported successfully', 'success');
            } catch (e) {
                console.error('Export failed:', e);
                showToast('Failed to export CSV', 'error');
            }
        });

        initPage();
    </script>
</body>
</html>
