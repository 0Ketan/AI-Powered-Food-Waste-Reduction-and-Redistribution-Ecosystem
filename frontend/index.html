<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Guide - AnnaSetu AI</title>
    <link rel="stylesheet" href="/shared/styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <script type="module" src="/shared/nav.js"></script>

    <main id="main-content" class="page">
        <div class="container">
            <header class="page-header">
                <h1 class="page-title">
                    <span>Demo Guide</span>
                    <span class="goal-tag">Overview</span>
                </h1>
                <p class="page-subtitle">7-step walkthrough from docs/DEMO_SCRIPT.md plus live module health.</p>
            </header>

            <!-- Module Modes Table -->
            <div class="card" style="margin-bottom: var(--space-6);">
                <div class="card-header">
                    <h2 class="card-title">Module Status (/api/health)</h2>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Module</th>
                                    <th>Mode</th>
                                </tr>
                            </thead>
                            <tbody id="health-modules-body">
                                <tr><td colspan="2" class="text-muted">Loading module status...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 7 Steps from DEMO_SCRIPT.md -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">7-Step Demo Walkthrough</h2>
                </div>
                <div class="card-body" id="demo-steps-list">
                    <p class="text-muted">Loading demo steps...</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import * as api from '/shared/api.js';
        import { getHealth, escapeHtml } from '/shared/api.js';
        import { navReady } from '/shared/nav.js';
        import { state, saveUser, ensureUserLoaded } from '/shared/state.js';

        const STEPS = [
            {
                num: 1,
                title: 'Health & Demo Users Check',
                role: 'kitchen',
                desc: 'Verify all modules and inspect the seeded kitchen dashboard.',
                href: '/kitchen/dashboard.html',
            },
            {
                num: 2,
                title: 'Demo Clock Controls',
                role: 'kitchen',
                desc: 'Use "+1 Hour" and "Reset Demo" in the top bar to test expiry and alerts.',
                href: '/kitchen/listings.html',
            },
            {
                num: 3,
                title: 'Plan Cooking Quantity (Forecast)',
                role: 'kitchen',
                desc: 'Choose slot, weather, event, and safety margin slider to get AI quantity advice.',
                href: '/kitchen/plan.html',
            },
            {
                num: 4,
                title: 'Log Daily Waste',
                role: 'kitchen',
                desc: 'Record prepared, served, leftover plates and whether food ran short.',
                href: '/kitchen/log.html',
            },
            {
                num: 5,
                title: 'Safety Check & Post Surplus (F1)',
                role: 'kitchen',
                desc: 'Evaluate food safety, print label, and post safe surplus to the marketplace.',
                href: '/kitchen/post-surplus.html',
            },
            {
                num: 6,
                title: 'Recipient Finds & Claims Food (F2)',
                role: 'ngo',
                desc: 'Switch to an NGO/Mandir account, browse ranked nearby listings, and claim one.',
                href: '/recipient/nearby.html',
            },
            {
                num: 7,
                title: 'Pickup, Serve & Complete Record (F2/F3)',
                role: 'ngo',
                desc: 'View pickup code, mark served, and complete the safety donation record.',
                href: '/recipient/claims.html',
            },
        ];

        function modeBadge(mode) {
            if (mode === 'live') return '<span class="badge badge-success">live</span>';
            if (mode === 'broken') return '<span class="badge badge-danger">broken</span>';
            return `<span class="badge badge-warning">${escapeHtml(mode || 'stub')}</span>`;
        }

        async function loadHealth() {
            const tbody = document.getElementById('health-modules-body');
            try {
                const health = await getHealth();
                const mods = health.modules || health.services || {};
                const entries = Object.entries(mods);
                if (!entries.length) {
                    tbody.innerHTML = '<tr><td colspan="2" class="text-muted">No module data returned.</td></tr>';
                    return;
                }
                tbody.innerHTML = entries.map(([name, mode]) => `
                    <tr>
                        <td><strong>${escapeHtml(name)}</strong></td>
                        <td>${modeBadge(mode)}</td>
                    </tr>
                `).join('');
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="2" class="text-danger">Failed to load /api/health: ${escapeHtml(e.message)}</td></tr>`;
            }
        }

        function renderSteps() {
            const container = document.getElementById('demo-steps-list');
            container.innerHTML = STEPS.map(step => `
                <div class="card" style="margin-bottom: var(--space-3);">
                    <div class="card-body" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;">
                        <div>
                            <h3 style="margin-bottom:0.25rem;">Step ${step.num}: ${escapeHtml(step.title)}</h3>
                            <p class="text-muted" style="margin:0;">${escapeHtml(step.desc)}</p>
                        </div>
                        <button type="button" class="btn btn-primary btn-sm btn-switch-go" data-role="${step.role}" data-href="${step.href}">
                            Switch and go →
                        </button>
                    </div>
                </div>
            `).join('');

            container.querySelectorAll('.btn-switch-go').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetRole = btn.dataset.role;
                    const href = btn.dataset.href;
                    const user = state.users.find(u => u.role === targetRole) || state.users[0];
                    if (user) saveUser(user);
                    window.location.href = href;
                });
            });
        }

        await navReady;
        await ensureUserLoaded(api);
        loadHealth();
        renderSteps();
    </script>
</body>
</html>
