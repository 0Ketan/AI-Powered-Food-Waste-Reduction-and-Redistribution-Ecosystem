<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Needs - AnnaSetu AI</title>
    <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <script type="module" src="shared/nav.js"></script>

    <main id="main-content" class="page">
        <div class="container">
            <header class="page-header">
                <h1 class="page-title">
                    <span>📋</span>
                    <span>My Needs</span>
                </h1>
                <p class="page-subtitle">Manage food needs and track pledges</p>
            </header>

            <!-- Create Need Form -->
            <div class="card" style="margin-bottom: var(--space-6);">
                <div class="card-header">
                    <h2 class="card-title">Create New Need</h2>
                </div>
                <div class="card-body">
                    <form id="need-form" class="form-grid">
                        <div class="form-group">
                            <label for="need-title" class="form-label">Need Title <span class="required">*</span></label>
                            <input type="text" id="need-title" class="form-input" placeholder="e.g., Daily Meals for 50 People" required>
                        </div>
                        <div class="form-group">
                            <label for="need-food-type" class="form-label">Food Type <span class="required">*</span></label>
                            <select id="need-food-type" class="form-select" required>
                                <option value="">Select Type</option>
                                <option value="cooked_meal">Cooked Meal</option>
                                <option value="prepared_ingredients">Prepared Ingredients</option>
                                <option value="raw_produce">Raw Produce</option>
                                <option value="packaged_food">Packaged Food</option>
                                <option value="bakery">Bakery Items</option>
                                <option value="beverages">Beverages</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="need-quantity" class="form-label">Quantity Needed (kg) <span class="required">*</span></label>
                            <input type="number" id="need-quantity" class="form-input" step="0.1" min="0.1" placeholder="0.0" required>
                        </div>
                        <div class="form-group">
                            <label for="need-urgency" class="form-label">Urgency <span class="required">*</span></label>
                            <select id="need-urgency" class="form-select" required>
                                <option value="">Select Urgency</option>
                                <option value="low">Low - Flexible timing</option>
                                <option value="medium">Medium - Within 24 hours</option>
                                <option value="high">High - Within 6 hours</option>
                                <option value="critical">Critical - Within 2 hours</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="need-frequency" class="form-label">Frequency</label>
                            <select id="need-frequency" class="form-select">
                                <option value="one_time">One Time</option>
                                <option value="daily">Daily</option>
                                <option value="weekly">Weekly</option>
                                <option value="monthly">Monthly</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="need-location" class="form-label">Pickup Location <span class="required">*</span></label>
                            <input type="text" id="need-location" class="form-input" placeholder="e.g., Community Center, Block B" required>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label for="need-description" class="form-label">Description</label>
                            <textarea id="need-description" class="form-input" rows="3" placeholder="Details about the need, dietary requirements, special instructions..."></textarea>
                        </div>
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <button type="submit" class="btn btn-primary" id="btn-create-need">
                                <span>📋</span> Create Need
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- My Needs Table -->
            <div class="card" id="my-needs-card">
                <div class="card-header">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-3);">
                        <h2 class="card-title">My Needs</h2>
                        <button class="btn btn-sm btn-outline" id="btn-refresh-needs">
                            <span>🔄</span> Refresh
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Type</th>
                                    <th>Qty (kg)</th>
                                    <th>Urgency</th>
                                    <th>Frequency</th>
                                    <th>Location</th>
                                    <th>Status</th>
                                    <th>Pledges</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="needs-body">
                                <tr>
                                    <td colspan="10" class="text-center text-muted">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div id="empty-needs" style="display: none; text-align: center; padding: var(--space-12);">
                        <div style="font-size: 4rem; margin-bottom: var(--space-4);">📋</div>
                        <h3 style="margin-bottom: var(--space-2);">No Needs Created Yet</h3>
                        <p class="text-muted" style="margin-bottom: var(--space-6);">Create your first need above to start receiving pledges.</p>
                    </div>
                </div>
            </div>

            <!-- Pledges Detail Modal -->
            <div class="modal-overlay" id="pledges-modal" role="dialog" aria-modal="true" aria-labelledby="pledges-modal-title">
                <div class="modal modal-lg">
                    <div class="modal-header">
                        <h2 class="modal-title" id="pledges-modal-title">🤝 Pledges for Need</h2>
                        <button class="modal-close" onclick="closePledgesModal()">&times;</button>
                    </div>
                    <div class="modal-body" id="pledges-modal-body"></div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { state, initState } from './shared/state.js';
        import { api, formatDateTime, showToast, escapeHtml } from './shared/api.js';
        import { updateNavUI } from './shared/nav.js';

        initState();
        updateNavUI();

        // Only NGOs and Mandirs can access this page
        if (!state.canAccessPage(['ngo', 'mandir'])) {
            window.location.href = 'index.html';
        }

        const needsBody = document.getElementById('needs-body');
        const emptyNeeds = document.getElementById('empty-needs');
        const pledgesModal = document.getElementById('pledges-modal');
        const pledgesModalBody = document.getElementById('pledges-modal-body');

        let allNeeds = [];

        async function initPage() {
            await loadNeeds();
            setupEventListeners();
        }

        function setupEventListeners() {
            document.getElementById('need-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                await createNeed();
            });
            document.getElementById('btn-refresh-needs')?.addEventListener('click', loadNeeds);
        }

        async function loadNeeds() {
            try {
                needsBody.innerHTML = '<tr><td colspan="10" class="text-center text-muted">Loading...</td></tr>';
                emptyNeeds.style.display = 'none';

                const needs = await api.getMarketplaceNeeds({ created_by: state.user.id });
                allNeeds = needs || [];

                renderNeeds(allNeeds);
            } catch (e) {
                console.error('Failed to load needs:', e);
                needsBody.innerHTML = '<tr><td colspan="10" class="text-center text-danger">Failed to load needs</td></tr>';
                showToast('Failed to load needs', 'error');
            }
        }

        function renderNeeds(needs) {
            if (!needs || needs.length === 0) {
                needsBody.innerHTML = '';
                emptyNeeds.style.display = 'block';
                return;
            }

            emptyNeeds.style.display = 'none';
            needsBody.innerHTML = needs.map(need => {
                const urgencyClass = getUrgencyBadgeClass(need.urgency);
                const statusClass = getNeedStatusBadgeClass(need.status);
                const pledgeCount = need.pledge_count || 0;
                const fulfilledCount = need.fulfilled_count || 0;

                return `
                    <tr>
                        <td>${escapeHtml(need.title)}</td>
                        <td>${escapeHtml(need.food_type.replace('_', ' '))}</td>
                        <td>${need.quantity_kg}</td>
                        <td><span class="badge badge-${urgencyClass}">${escapeHtml(need.urgency)}</span></td>
                        <td>${escapeHtml(need.frequency.replace('_', ' '))}</td>
                        <td>${escapeHtml(need.location)}</td>
                        <td><span class="badge badge-${statusClass}">${escapeHtml(need.status.replace('_', ' '))}</span></td>
                        <td>
                            <span style="font-weight: 600;">${pledgeCount}</span>
                            ${fulfilledCount > 0 ? ` <span class="text-muted">(${fulfilledCount} fulfilled)</span>` : ''}
                        </td>
                        <td>${formatDateTime(need.created_at)}</td>
                        <td>
                            <div style="display: flex; gap: var(--space-1); flex-wrap: wrap;">
                                <button class="btn btn-sm btn-outline" onclick="viewPledges(${need.id})" title="View Pledges">
                                    🤝
                                </button>
                                ${need.status === 'open' ? `
                                    <button class="btn btn-sm btn-outline" onclick="closeNeed(${need.id})" title="Close Need">
                                        ✕
                                    </button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getUrgencyBadgeClass(urgency) {
            const classes = {
                'low': 'success',
                'medium': 'warning',
                'high': 'danger',
                'critical': 'danger'
            };
            return classes[urgency] || 'gray';
        }

        function getNeedStatusBadgeClass(status) {
            const classes = {
                'open': 'success',
                'fulfilled': 'info',
                'closed': 'gray',
                'cancelled': 'danger'
            };
            return classes[status] || 'gray';
        }

        async function createNeed() {
            const title = document.getElementById('need-title').value.trim();
            const foodType = document.getElementById('need-food-type').value;
            const quantityKg = parseFloat(document.getElementById('need-quantity').value);
            const urgency = document.getElementById('need-urgency').value;
            const frequency = document.getElementById('need-frequency').value;
            const location = document.getElementById('need-location').value.trim();
            const description = document.getElementById('need-description').value.trim();

            if (!title || !foodType || !quantityKg || !urgency || !location) {
                showToast('Please fill all required fields', 'warning');
                return;
            }

            const btn = document.getElementById('btn-create-need');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Creating...';

            try {
                const result = await api.createMarketplaceNeed({
                    title,
                    food_type: foodType,
                    quantity_kg: quantityKg,
                    urgency,
                    frequency,
                    location,
                    description,
                    created_by: state.user.id
                });

                showToast('Need created successfully!', 'success');
                document.getElementById('need-form').reset();
                await loadNeeds();
            } catch (e) {
                console.error('Failed to create need:', e);
                showToast('Failed to create need: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>📋</span> Create Need';
            }
        }

        window.viewPledges = async function(needId) {
            const need = allNeeds.find(n => n.id === needId);
            if (!need) return;

            try {
                const pledges = await api.getPledgesForNeed(needId);

                pledgesModalBody.innerHTML = `
                    <div style="margin-bottom: var(--space-4); padding: var(--space-4); background: var(--color-gray-50); border-radius: var(--radius-md);">
                        <h4 style="margin: 0 0 var(--space-2) 0;">${escapeHtml(need.title)}</h4>
                        <div style="font-size: var(--font-size-sm); color: var(--color-gray-600);">
                            ${escapeHtml(need.food_type.replace('_', ' '))} • ${need.quantity_kg} kg • ${escapeHtml(need.urgency)} urgency
                        </div>
                    </div>

                    ${!pledges || pledges.length === 0 ? `
                        <div class="text-center text-muted" style="padding: var(--space-8);">
                            <div style="font-size: 3rem; margin-bottom: var(--space-3);">🤝</div>
                            <p>No pledges yet</p>
                        </div>
                    ` : `
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Donor</th>
                                        <th>Qty Pledged (kg)</th>
                                        <th>Status</th>
                                        <th>Pledged At</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${pledges.map(pledge => `
                                        <tr>
                                            <td>${escapeHtml(pledge.donor_name || 'Unknown')}</td>
                                            <td>${pledge.quantity_kg}</td>
                                            <td><span class="badge badge-${getPledgeStatusBadgeClass(pledge.status)}">${escapeHtml(pledge.status.replace('_', ' '))}</span></td>
                                            <td>${formatDateTime(pledge.created_at)}</td>
                                            <td>
                                                ${pledge.status === 'pledged' ? `
                                                    <button class="btn btn-sm btn-success" onclick="fulfillPledge(${pledge.id}, ${needId})" title="Mark as Fulfilled">
                                                        ✅ Fulfill
                                                    </button>
                                                ` : `
                                                    <span class="text-muted">${pledge.status === 'fulfilled' ? '✅ Fulfilled' : '✕ Cancelled'}</span>
                                                `}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                `;

                pledgesModal.classList.add('show');
                document.body.style.overflow = 'hidden';
            } catch (e) {
                console.error('Failed to load pledges:', e);
                showToast('Failed to load pledges', 'error');
            }
        };

        function getPledgeStatusBadgeClass(status) {
            const classes = {
                'pledged': 'warning',
                'fulfilled': 'success',
                'cancelled': 'danger'
            };
            return classes[status] || 'gray';
        }

        window.closePledgesModal = function() {
            pledgesModal.classList.remove('show');
            document.body.style.overflow = '';
        };

        window.fulfillPledge = async function(pledgeId, needId) {
            if (!confirm('Mark this pledge as fulfilled?')) return;

            try {
                await api.fulfillPledge(pledgeId);
                showToast('Pledge marked as fulfilled', 'success');
                closePledgesModal();
                await loadNeeds();
            } catch (e) {
                console.error('Failed to fulfill pledge:', e);
                showToast('Failed to fulfill pledge: ' + e.message, 'error');
            }
        };

        window.closeNeed = async function(needId) {
            if (!confirm('Close this need? It will no longer accept new pledges.')) return;

            try {
                await api.closeNeed(needId);
                showToast('Need closed', 'success');
                await loadNeeds();
            } catch (e) {
                console.error('Failed to close need:', e);
                showToast('Failed to close need: ' + e.message, 'error');
            }
        };

        // Close modal on overlay click
        pledgesModal.addEventListener('click', (e) => {
            if (e.target === pledgesModal) {
                closePledgesModal();
            }
        });

        // Initialize
        initPage();
    </script>
</body>
</html>
